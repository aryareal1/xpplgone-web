[project]
name = "ocr"
version = "0.1.0"
description = "XIRPL OCR service"
readme = "README.md"
authors = [
    { name = "aryareal", email = "aryadwiputra193@gmail.com" }
]
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi>=0.141.1",
    "paddleocr>=3.7.0",
    "paddlepaddle-gpu",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.3",
]

[project.scripts]
ocr = "ocr.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"


[[tool.uv.index]]
name = "paddle"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu130/"
explicit = true


[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle" }