name: xirpl

services:
  db:
    container_name: xirpl_db
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
      POSTGRES_DB: $POSTGRES_DB
    volumes:
      - pg-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    configs:
      - source: init-db
        target: /docker-entrypoint-initdb.d/init.sql
      
  s3:
    container_name: xirpl_s3
    image: pgsty/silo
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: $S3_ACCESS_KEY_ID
      MINIO_ROOT_PASSWORD: $S3_SECRET_ACCESS_KEY
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "silo healthcheck ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    container_name: xirpl_caddy
    image: caddy
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

  api:
    container_name: xirpl_api
    image: aryareal/api-xirpl
    restart: unless-stopped
    pull_policy: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GOOGLE_CLIENT_ID: $GOOGLE_CLIENT_ID
      GOOGLE_CLIENT_SECRET: $GOOGLE_CLIENT_SECRET
      JWT_SECRET: $JWT_SECRET
      HASH_SECRET: $HASH_SECRET
      WEB_URL: $WEB_URL
      API_URL: $API_URL
      S3_ENDPOINT: http://s3:9000
      S3_ACCESS_KEY_ID: $S3_ACCESS_KEY_ID
      S3_SECRET_ACCESS_KEY: $S3_SECRET_ACCESS_KEY
      S3_BUCKET: $S3_BUCKET
    ports:
      - "127.0.0.1:3611:3611"
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy

  web:
    container_name: xirpl_web
    image: aryareal/web-xirpl
    restart: unless-stopped
    pull_policy: always
    environment:
      NEXT_PUBLIC_API_URL: $API_URL
    ports:
      - "127.0.0.1:3610:3610"
    depends_on:
      - api

  umami:
    container_name: xirpl_umami
    image: ghcr.io/umami-software/umami:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/umami
      APP_SECRET: $UMAMI_SECRET
    init: true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:3000/api/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg-data:
  minio-data:
  caddy-data:
  caddy-config:

configs:
  init-db:
    content: |
      CREATE DATABASE umami;